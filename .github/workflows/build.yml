name: Build

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'SDK URL for scutclient to build'
        required: true
        default: 'https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt7620/openwrt-sdk-24.10.5-ramips-mt7620_gcc-13.3.0_musl.Linux-x86_64.tar.zst'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libncurses5-dev zstd
          mkdir build
          cd build
          wget "${{ github.event.inputs.sdk_url }}"
          tar --zstd -xf *.tar.zst
          rm *.tar.zst
          mv openwrt-sdk-* openwrt
          mkdir -p openwrt/package/scutclient
          cp ../openwrt/Makefile openwrt/package/scutclient/
          cd openwrt
          make defconfig
          make package/scutclient/compile V=s
          cp ./bin/packages/*/*/*.ipk ../../

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: scutclient-ipk
          path: '*.ipk'
